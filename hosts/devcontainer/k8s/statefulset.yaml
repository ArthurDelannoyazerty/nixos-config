apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devcontainer-arthur

spec:
  serviceName: devcontainer-arthur
  replicas: 1
  revisionHistoryLimit: 3

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  selector:
    matchLabels:
      app.kubernetes.io/name: devcontainer-arthur

  template:
    metadata:
      labels:
        app.kubernetes.io/name: devcontainer-arthur

    spec:
      automountServiceAccountToken: false

      runtimeClassName: nvidia

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      tolerations:
        - effect: NoSchedule
          key: project
          operator: Equal
          value: ia

        - effect: NoSchedule
          key: gpu
          operator: Equal
          value: h200

      initContainers:
        - name: seed-nix
          image: ghcr.io/arthurdelannoyazerty/nix-devcontainer:latest
          imagePullPolicy: IfNotPresent

          command:
            - /bin/devcontainer-seed-nix
          args:
            - /persist

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: nix
              mountPath: /persist

            - name: tmp
              mountPath: /tmp

      containers:
        - name: workspace
          image: ghcr.io/arthurdelannoyazerty/nix-devcontainer:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

          resources:
            limits:
              nvidia.com/gpu: 1

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: home
              mountPath: /home/arthur

            - name: nix
              mountPath: /nix
              subPath: nix

            - name: tmp
              mountPath: /tmp

          readinessProbe:
            exec:
              command:
                - /bin/test
                - -f
                - /tmp/devcontainer-ready
            periodSeconds: 5
            timeoutSeconds: 2

      volumes:
        - name: home
          hostPath:
            path: /work/scratch/arthur
            type: Directory

        - name: tmp
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: nix
      spec:
        accessModes:
          - ReadWriteOnce

        # Uncomment if your cluster has no default StorageClass:
        # storageClassName: your-storage-class

        resources:
          requests:
            storage: 30Gi