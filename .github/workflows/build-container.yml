name: Build and Push DevContainer

on:
  push:
    branches:
      - main
    paths:
      - "hosts/devcontainer/**"
      - "!hosts/devcontainer/k8s/**"
      - "!hosts/devcontainer/README_DEVCONTAINER.md"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-container.yml"

  pull_request:
    paths:
      - "hosts/devcontainer/**"
      - "!hosts/devcontainer/k8s/**"
      - "!hosts/devcontainer/README_DEVCONTAINER.md"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-container.yml"

  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  LOCAL_IMAGE: nix-devcontainer:latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{
              hashFiles(
                'flake.lock',
                'flake.nix',
                'hosts/devcontainer/default.nix',
                'hosts/devcontainer/scripts/**'
              )
            }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          gc-max-store-size: 10G

      - name: Check shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n hosts/devcontainer/scripts/*.sh

      - name: Prepare image metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"

          echo "IMAGE_NAME=${owner}/nix-devcontainer" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build and load image
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail

          stream_image="$(
            nix build \
              .#devcontainer-stream \
              --no-link \
              --print-out-paths \
              --print-build-logs
          )"

          echo "Streaming image from: $stream_image"

          "$stream_image" | docker load

          docker image inspect "$LOCAL_IMAGE" >/dev/null

      - name: Smoke test non-root container
        shell: bash
        run: |
          set -Eeuo pipefail

          home="$RUNNER_TEMP/devcontainer-home"
          nix_volume="$RUNNER_TEMP/devcontainer-nix"

          mkdir -p \
            "$home/dotfiles" \
            "$nix_volume"

          sudo chown -R 999:999 \
            "$home" \
            "$nix_volume"

          echo "::group::Seed persistent Nix store"

          docker run --rm \
            --network none \
            --user 999:999 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount type=bind,src="$nix_volume",dst=/persist \
            --entrypoint /bin/devcontainer-seed-nix \
            "$LOCAL_IMAGE" \
            /persist

          echo "::endgroup::"

          echo "::group::Run workspace"

          docker run --rm \
            --network none \
            --user 999:999 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount type=bind,src="$home",dst=/home/arthur \
            --mount type=bind,src="$nix_volume/nix",dst=/nix \
            "$LOCAL_IMAGE" \
            /bin/bash -lc '
              set -Eeuo pipefail

              test "$(id -u)" = 999
              test "$(id -g)" = 999

              test -w "$HOME"
              test -w /tmp
              test -w /nix/store
              test -w /nix/var/nix

              nix --version
              nix path-info "$DEVCONTAINER_ROOT" >/dev/null

              command -v devcontainer-sync-dotfiles >/dev/null
              command -v devcontainer-install-extensions >/dev/null
              command -v devcontainer-doctor >/dev/null

              # Verify that the user profile is writable without downloading
              # another package from the internet.
              package_root="$(
                dirname "$(dirname "$(readlink -f /bin/jq)")"
              )"

              nix profile install "$package_root"
              nix profile list

              echo "Smoke test passed."
            '

          echo "::endgroup::"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"

          docker tag "$LOCAL_IMAGE" "${image}:${IMAGE_TAG}"
          docker push "${image}:${IMAGE_TAG}"

          # Only main is allowed to update the convenience `latest` tag.
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag "$LOCAL_IMAGE" "${image}:latest"
            docker push "${image}:latest"
          fi

          {
            echo "## DevContainer image"
            echo
            echo "\`${image}:${IMAGE_TAG}\`"
            echo
            echo "Set this in:"
            echo
            echo "\`hosts/devcontainer/k8s/kustomization.yaml\`"
            echo
            echo "\`\`\`yaml"
            echo "newTag: ${IMAGE_TAG}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"